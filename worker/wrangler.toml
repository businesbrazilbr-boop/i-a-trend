name = "worker-ias"
main = "./src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "IAS_CACHE"
id = "fb98c02d911c416db3ff592f23d81ceb"

[vars]
SITE_URL = "https://i-a-trend.com"
ENVIRONMENT = "production"
# DAILY_LIMIT saiu daqui de proposito. Existia como var e como constante, e o
# laco de ingestao nao aplicava nenhuma das duas: o worker publicava tudo o que
# encontrasse. Agora o limite e' uma unica constante em src/index.ts, aplicada
# de verdade antes do laco.

[[d1_databases]]
binding = "IAS_DB"
database_name = "ias-news"
database_id = "2b5f1f94-cc05-4f29-890c-6785071caf84"

# Ilustracoes proprias geradas por Workers AI. Substitui o hotlink da og:image
# do veiculo original. Criar antes do deploy:
#   npx wrangler r2 bucket create ias-images
[[r2_buckets]]
binding = "IAS_IMAGES"
bucket_name = "ias-images"

[ai]
binding = "AI"

# Uma execucao por dia, as 09:00 UTC = 06:00 em Brasilia. O cron do Cloudflare e'
# sempre UTC; para mudar o horario local, desloque este valor (09:00 BRT seria
# "0 12 * * *").
#
# O trigger antigo era */30 * * * * — 48 execucoes por dia — e foi removido porque
# alimentava a copia em massa de materias de outros veiculos. 1x/dia com
# DAILY_LIMIT = 5 e' o teto deliberado: cinco artigos diarios.
#
# Para desligar sem apagar nada, basta voltar a crons = [] e refazer o deploy.
[triggers]
crons = ["0 9 * * *"]
