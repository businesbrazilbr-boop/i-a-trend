name = "i-a-trend"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = "dist/_worker.js/index.js"

# O binding e' obrigatorio, nao opcional: sem ele o adaptador do Astro chama
# env.ASSETS.fetch() em toda rota que nao casa e estoura com
# "TypeError: Cannot read properties of undefined (reading 'fetch')",
# devolvendo 500 de corpo vazio em vez da pagina 404.
[assets]
directory = "dist"
binding = "ASSETS"

# O adaptador @astrojs/cloudflare ativa sessions por padrao e espera um binding
# chamado SESSION; sem ele o build avisa "Invalid binding `SESSION`". O site nao
# usa sessions, entao apontamos para o namespace de cache que ja' existe.
[[kv_namespaces]]
binding = "SESSION"
id = "fb98c02d911c416db3ff592f23d81ceb"

[[d1_databases]]
binding = "IAS_DB"
database_name = "ias-news"
database_id = "2b5f1f94-cc05-4f29-890c-6785071caf84"

# Ilustracoes geradas pelo worker-ias. O site as serve em /img/<key>, assim nao
# e' preciso tornar o bucket publico nem criar um subdominio.
[[r2_buckets]]
binding = "IAS_IMAGES"
bucket_name = "ias-images"